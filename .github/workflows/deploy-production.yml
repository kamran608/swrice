name: Deploy to Production Server

on:
  pull_request:
    branches: [ production ]
    types: [ closed ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if it's a merged PR to production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # Write SSH private key - decode from base64
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Add host to known_hosts
        ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
        
    - name: Deploy wp-content changes to server
      run: |
        echo "🚀 Deploying only changed files to server..."
        
        # Get list of changed files in wp-content from the last commit
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep "^wp-content/" || true)
        
        if [ -z "$CHANGED_FILES" ]; then
          echo "ℹ️ No wp-content files changed in this commit"
          exit 0
        fi
        
        echo "📁 Files to deploy:"
        echo "$CHANGED_FILES"
        
        # Debug: Show current working directory and verify files exist
        echo "🔍 Current directory: $(pwd)"
        echo "🔍 Verifying files exist locally:"
        for file in $CHANGED_FILES; do
          if [ -f "$file" ]; then
            echo "✅ $file exists ($(stat -c%s "$file") bytes)"
          else
            echo "❌ $file NOT FOUND"
          fi
        done
        
        # Create a temporary file list for rsync
        echo "$CHANGED_FILES" > /tmp/files_to_deploy.txt
        echo "🔍 File list contents:"
        cat /tmp/files_to_deploy.txt
        
        # Test SSH connection first
        echo "🔍 Testing SSH connection..."
        ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'; ls -la ${{ secrets.DEPLOY_PATH }}/"
        
        # Use rsync with --files-from to deploy only changed files (with verbose output)
        echo "🚀 Starting rsync deployment..."
        rsync -avz --progress --verbose \
          -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
          --files-from=/tmp/files_to_deploy.txt \
          --timeout=300 \
          ./ \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
        
        # Verify deployment by checking if files exist on server
        echo "🔍 Verifying deployment on server..."
        for file in $CHANGED_FILES; do
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "if [ -f '${{ secrets.DEPLOY_PATH }}/$file' ]; then echo '✅ $file deployed successfully'; else echo '❌ $file NOT FOUND on server'; fi"
        done
          
    - name: Deployment Success
      run: |
        echo "🎉 Deployment to swrice.com completed successfully!"
        echo "📁 Only Git-changed files deployed to server"
        echo "🛡️ All other server files preserved and untouched"
        echo "🌐 Your WordPress site is now updated at swrice.com"
        echo "✅ WordPress core files on server remain untouched"
