name: Deploy to Production Server

on:
  pull_request:
    branches: [ production ]
    types: [ closed ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if it's a merged PR to production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history to access base SHA for git diff
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # Write SSH private key - decode from base64
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Add host to known_hosts
        ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
        
    - name: Deploy wp-content changes to server
      run: |
        echo "🚀 Deploying only changed files to server..."
        
        # Determine the correct base and head SHA for comparison
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "📋 PR Event: Comparing $BASE_SHA...$HEAD_SHA"
        else
          # For workflow_dispatch or other events, compare with previous commit
          BASE_SHA="HEAD~1"
          HEAD_SHA="HEAD"
          echo "📋 Manual/Push Event: Comparing $BASE_SHA...$HEAD_SHA"
        fi
        
        # Get list of changed files in wp-content using proper SHA references
        CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA | grep "^wp-content/" || true)
        
        if [ -z "$CHANGED_FILES" ]; then
          echo "ℹ️ No wp-content files changed in this deployment"
          echo "✅ Server is already up to date!"
          exit 0
        fi
        
        echo "📁 Files to deploy ($(echo "$CHANGED_FILES" | wc -l) files):"
        echo "$CHANGED_FILES"
        
        # Verify files exist locally
        echo "🔍 Verifying files exist locally:"
        for file in $CHANGED_FILES; do
          if [ -f "$file" ]; then
            echo "✅ $file ($(stat -c%s "$file") bytes)"
          else
            echo "❌ $file NOT FOUND - skipping"
          fi
        done
        
        # Create file list for rsync (only existing files)
        echo "$CHANGED_FILES" | while read file; do
          if [ -f "$file" ]; then
            echo "$file"
          fi
        done > /tmp/files_to_deploy.txt
        
        # Check if we have any files to deploy after filtering
        if [ ! -s /tmp/files_to_deploy.txt ]; then
          echo "ℹ️ No valid files to deploy after verification"
          exit 0
        fi
        
        echo "🔍 Final deployment list:"
        cat /tmp/files_to_deploy.txt
        
        # Deploy only the changed files using rsync --files-from
        echo "🚀 Deploying $(cat /tmp/files_to_deploy.txt | wc -l) changed files..."
        rsync -avz --progress \
          -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
          --files-from=/tmp/files_to_deploy.txt \
          --timeout=300 \
          ./ \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
        
        echo "✅ Surgical deployment completed - only changed files transferred!"
          
    - name: Deployment Success
      run: |
        echo "🎉 Surgical deployment to swrice.com completed successfully!"
        echo "🎯 Only Git-changed files deployed (true incremental deployment)"
        echo "🛡️ All other server files completely untouched and preserved"
        echo "🌐 Your WordPress site is now updated at swrice.com"
        echo "✅ Maximum efficiency - minimal file transfer, maximum protection"
