name: Deploy to Production Server

on:
  pull_request:
    branches: [ production ]
    types: [ closed ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if it's a merged PR to production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # Write SSH private key - decode from base64
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Add host to known_hosts
        ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
        
    - name: Deploy wp-content changes to server
      run: |
        echo "🚀 Deploying wp-content changes to server..."
        
        # Use rsync to sync wp-content with --update flag (no --delete to preserve server files)
        # This will only transfer files that are newer locally than on the server
        rsync -avz --update --progress \
          -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
          --exclude='.git*' \
          --exclude='*.log' \
          --exclude='cache/' \
          --exclude='backup*' \
          --exclude='uploads/' \
          --timeout=300 \
          ./wp-content/ \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/
          
    - name: Deployment Success
      run: |
        echo "🎉 Deployment to swrice.com completed successfully!"
        echo "📁 wp-content synced with --update flag (only newer files transferred)"
        echo "🛡️ Server files preserved (no --delete flag, uploads excluded)"
        echo "🌐 Your WordPress site is now updated at swrice.com"
        echo "✅ WordPress core files on server remain untouched"
