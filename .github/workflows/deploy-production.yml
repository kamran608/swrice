name: Deploy to Production Server

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
    types: [ closed ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if it's a push to production OR a merged PR to production
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # Write SSH private key - decode from base64
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Test SSH key format
        echo "Testing SSH key format..."
        ssh-keygen -l -f ~/.ssh/id_ed25519 && echo "✅ SSH key is valid" || echo "❌ SSH key format issue detected"
        # Add host to known_hosts
        ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: ssh-keyscan failed, using StrictHostKeyChecking=no"
        # Test SSH connection
        echo "Testing SSH connection..."
        ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'" || echo "SSH connection failed"
        
    - name: Test network connectivity
      run: |
        echo "Testing network connectivity to server..."
        nc -z -v -w5 ${{ secrets.SSH_HOST }} ${{ secrets.SSH_PORT }} || echo "Direct connection failed, trying alternative methods"
        
    - name: Deploy to server
      run: |
        # Try deployment with enhanced SSH options
        rsync -avz --delete \
          -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3" \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='README.md' \
          --exclude='.gitignore' \
          --timeout=300 \
          ./ \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
          
    - name: Deployment Success
      run: |
        echo "🚀 Deployment to swrice.com completed successfully!"
        echo "📁 Files synced to: ${{ secrets.DEPLOY_PATH }}/"
        echo "🌐 Your WordPress site should now be updated at swrice.com"
